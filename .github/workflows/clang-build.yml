name: build

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'LLVM branch'
        required: true
        default: 'main'

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  BRANCH: ${{ github.event.inputs.BRANCH }}

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: rokibhasansagar/slimhub_actions@main
    - uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 64

    - name: prepare env
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev libncurses5-dev libsdl1.2-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-binfmt libgflags-dev python3
        sudo apt -y install bc binutils-dev bison build-essential ca-certificates ccache clang cmake curl file flex git libelf-dev libssl-dev lld make ninja-build python3-dev texinfo u-boot-tools xz-utils zlib1g-dev zstd

    - name: do the build
      run: |
        git config --global user.name "fukiame"
        git config --global user.email "fukiame@proton.me"
        bash build.sh
      continue-on-error: true
